name: Issue Assigned Notification

on:
  issues:
    types:
      - assigned

permissions:
  issues: write
  contents: read

jobs:
  notify-assignment:
    runs-on: ubuntu-latest

    steps:
      - name: Notify assignee
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const assignee = context.payload.issue.assignee.login;
            const issue_number = context.payload.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: `Issue is assigned to you, @${assignee}! 🎯

⏳ **Note:** Please submit a working PR within 3 days, else the issue will be unassigned and open for other contributors. 🚀`
            });
